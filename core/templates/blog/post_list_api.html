<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>blog post</h1>
    <ol id="post-wrapper"></ol>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js" 
                integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A=="
                crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
            $.get( "/blog/api/v1/post/", function( data, textStatus, jqXHR ) 
            {
                wrapper = $('#post-wrapper');
                for (post of data.results){
                    wrapper.append(`<li><a href='${post.relative_url}'><h2>${post.title}</h2></a></li>`)
                }
            }
        );
    </script>
    
</body>
</html>
